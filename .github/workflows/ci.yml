name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only to stash the encrypted device results as an unreferenced blob
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Firebase config
        env: { SERVICES_B64: "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" }
        if: env.SERVICES_B64 != ''
        run: echo "$SERVICES_B64" | base64 -d > app/google-services.json
      - name: Build, unit tests and lint
        run: ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleQa
      - name: Verify 16 KB page-size compatibility
        run: ./scripts/verify-16kb.sh app/build/outputs/apk/qa/app-qa.apk
      - name: Collect APKs for the emulator
        run: |
          mkdir -p apks/debug apks/androidTest/debug apks/qa
          cp app/build/outputs/apk/debug/app-debug.apk apks/debug/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk apks/androidTest/debug/
          cp app/build/outputs/apk/qa/app-qa.apk apks/qa/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator checks (instrumented journey, screenshots, monkey on the shrunk build)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-checks.sh apks
      - name: Stash device results (encrypted)
        if: always()
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$ARTIFACT_KEY" ] && [ -d device-results ]; then
            tar czf device-results.tgz device-results
            bash scripts/stash-encrypted.sh device-results.tgz device-results
          fi
      - name: Device summary
        if: always()
        run: |
          tail -3 device-results/instrumentation.txt || true
          grep -E "Events injected|Monkey finished|CRASH|ANR" device-results/monkey.txt || true
          grep -cE "FATAL EXCEPTION" device-results/logcat-qa.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check src/index.js && npm test
