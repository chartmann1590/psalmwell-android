name: Release bundle
# Builds the signed Play upload bundle on demand. Nothing is published from here: the bundle is
# uploaded to Google Play by hand and distributed only through Google Play.
on:
  workflow_dispatch:
permissions:
  contents: write   # only to stash the encrypted bundle as an unreferenced blob
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          test -n "$SERVICES_B64" || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "$SERVICES_B64" | base64 -d > app/google-services.json
      - name: Build signed bundle
        env:
          PSALMWELL_KEYSTORE: ${{ runner.temp }}/upload.jks
          PSALMWELL_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          PSALMWELL_KEY_ALIAS: upload
        run: ./gradlew --stacktrace :app:bundleRelease
      - name: Check bundle signature and contents
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -2
          unzip -l app/build/outputs/bundle/release/app-release.aab | grep -c "base/dex/" 
      - run: rm -f "$RUNNER_TEMP/upload.jks"
        if: always()
      - name: Stash bundle (encrypted, not published)
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp app/build/outputs/bundle/release/app-release.aab out/ && cp app/build/outputs/mapping/release/mapping.txt out/
          sha256sum out/* 
          tar czf release.tgz out
          bash scripts/stash-encrypted.sh release.tgz release-bundle
